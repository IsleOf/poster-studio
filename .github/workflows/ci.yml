# CI: frontend build + the stable end-to-end suites.
# Scope note: server/ is gitignored and deployed separately (rsync), so it is not built/tested here.
# The MapLibre "Mode switching" tests in poster-modes are environmentally flaky (tile server
# unreachable in CI) and are intentionally excluded to avoid false failures.
name: CI

on:
  push:
    branches: [main, codex/backup-current-state-20260501]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run stable e2e suites
        run: npx playwright test tests/routing-new.test.ts tests/user-journeys.test.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 7
